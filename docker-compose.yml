services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hiring_platform
      POSTGRES_USER: hiring
      POSTGRES_PASSWORD: hiring
    ports:
      - "5433:5432"
    volumes:
      - hiring_platform_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiring -d hiring_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hiring_platform_pg:

